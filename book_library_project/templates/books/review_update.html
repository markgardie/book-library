{% extends 'base.html' %}

{% block title %}Редагувати рецензію - {{ block.super }}{% endblock %}

{% block content %}
<h2 class="mb-4">Редагувати рецензію на <strong>{{ review.book.title }}</strong></h2>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="d-grid">
        <button type="submit" class="btn btn-primary">
            <i class="fas fa-save"></i> Зберегти зміни
        </button>
    </div>
</form>
{% endblock %}

{% extends 'base.html' %}

{% block title %}Залишити рецензію - {{ block.super }}{% endblock %}

{% block content %}
<h2 class="mb-4">Залишити рецензію на <strong>{{ book.title }}</strong></h2>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="d-grid">
        <button type="submit" class="btn btn-success">
            <i class="fas fa-plus"></i> Опублікувати
        </button>
    </div>
</form>
{% endblock %}
